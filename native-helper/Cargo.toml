[package]
name = "atuin-ssh-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
build = "build.rs"

[features]
benchmark = []

[[bin]]
name = "atuin-ssh-native"
path = "src/main.rs"

[[bin]]
name = "atuin-ssh-bench-seed"
path = "src/bin/bench_seed.rs"
required-features = ["benchmark"]

[dependencies]
atuin-client = { path = "../atuin-client", default-features = false }
atuin-common = { path = "../atuin-common", features = ["sqlite"] }
atuin-domain = { path = "../atuin-domain" }
eyre = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
time = { workspace = true }
tokio = { workspace = true }
